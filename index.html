<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atelier Électronique — Maintenance</title>
    <style>
      :root { color-scheme: dark; --bg: #07111f; --panel: rgba(255,255,255,0.08); --text: #f5f7ff; --muted: #b9c4dc; --accent: #7c8cff; --accent2: #35d7aa; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(135deg, #081120 0%, #111a31 45%, #060913 100%);
        color: var(--text);
      }
      .card {
        width: min(100%, 760px);
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.12);
        backdrop-filter: blur(16px);
        border-radius: 24px;
        padding: 42px 36px;
        box-shadow: 0 25px 70px rgba(0,0,0,0.35);
      }
      .badge {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(124, 140, 255, 0.16);
        color: var(--accent2);
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 0.82rem;
        margin-bottom: 18px;
      }
      h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 3vw, 2.7rem); }
      p { margin: 0 0 12px; line-height: 1.7; color: var(--muted); font-size: 1rem; }
      .highlight { color: var(--accent); font-weight: 700; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
      .btn {
        display: inline-block;
        text-decoration: none;
        color: white;
        padding: 12px 16px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        font-weight: 700;
      }
      .small { font-size: 0.95rem; color: #95a0c6; margin-top: 18px; }
      @media (max-width: 640px) { .card { padding: 28px 20px; } }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Maintenance</div>
      <h1>Nous mettons à jour le site</h1>
      <p>Le site <span class="highlight">Atelier Électronique</span> est actuellement en maintenance pour améliorer votre expérience.</p>
      <p>Les services reviendront très prochainement. Merci pour votre compréhension.</p>
      <div class="actions">
        <a class="btn" href="https://github.com/juancodepyandc/site_rep">Voir le dépôt GitHub</a>
      </div>
      <p class="small">Atelier Électronique — maintenance prévue et temporaire.</p>
    </main>
  </body>
</html>
