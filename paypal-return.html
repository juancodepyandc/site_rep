<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paiement confirmé</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="center">
  <main class="result result--paypal success">
    <span class="result__kicker">Paiement PayPal</span>
    <h1>Paiement confirme</h1>
    <p class="result__lead">Commande validee. La facture est envoyee automatiquement a l'email du devis/paiement.</p>
    <p id="captureStatus" class="result__status" aria-live="polite">Validation de la commande...</p>
    <button id="returnHomeBtn" class="btn btn--primary btn--shine" type="button" onclick="window.location.href='/'" disabled>
      Retour au site
    </button>
  </main>

<script>
let captureDone = false;

function finalizeUi(message, { enableButton = true, autoRedirectMs = 0 } = {}) {
  const statusEl = document.getElementById("captureStatus");
  const btn = document.getElementById("returnHomeBtn");
  if (statusEl) statusEl.textContent = message;
  if (btn && enableButton) btn.disabled = false;
  if (autoRedirectMs > 0) {
    window.setTimeout(() => {
      window.location.href = "/";
    }, autoRedirectMs);
  }
}

async function finish(){
  if (captureDone) return;
  captureDone = true;
  const btn = document.getElementById("returnHomeBtn");
  if (btn) btn.disabled = true;

  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  if (!token) {
    finalizeUi("Token PayPal manquant. Retourne sur la page principale.", { enableButton: true });
    return;
  }

  try{
    const res = await fetch("/api/paypal-capture-order", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderID: token })
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data?.ok) {
      const receipt = data?.receiptEmail?.sent
        ? "Facture envoyee automatiquement."
        : "Paiement capture. Envoi facture en attente de configuration email.";
      finalizeUi(`${receipt} Redirection...`, { enableButton: true, autoRedirectMs: 1500 });
      return;
    }

    finalizeUi("Paiement capture avec alerte technique. Verifie le back-office.", { enableButton: true });
  } catch {
    finalizeUi("Capture impossible depuis cette page. Verifie l'API.", { enableButton: true });
  }
}

document.addEventListener("DOMContentLoaded", finish);
</script>
</body>
</html>
